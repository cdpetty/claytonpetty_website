<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading · Clayton Petty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#fff;--text:#232333;--blue:#1a6fbf;--muted:#626575;--line:#d8dce4}
@media(prefers-color-scheme:dark){:root{--bg:#282a36;--text:#f8f8f2;--blue:#83b6fa;--muted:#b2b6c4;--line:#4a4f60}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 'Roboto Mono',monospace}main{max-width:1320px;margin:auto;padding:32px 20px 48px}
a{color:inherit;text-decoration:none}a:hover{color:var(--blue);text-decoration:underline}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}header>a{font-size:18px;border-bottom:2px solid var(--blue)}header nav a{color:var(--muted)}
.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:25px;margin:0}#status{font-size:11px;color:var(--muted);margin:4px 0 0}input{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:9px 12px;width:230px;max-width:100%}
#items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.topic-section{min-width:0;border:1px solid var(--line);border-radius:7px;padding:18px}h2{font-size:15px;margin:0 0 14px;color:var(--blue)}ul{list-style:none;padding:0;margin:0}.topic-section li{padding:12px 0;border-top:1px solid var(--line)}.topic-section li:first-child{border:0;padding-top:0}.topic-section li>a{font-size:13px;font-weight:700;overflow-wrap:anywhere}.source{display:block;color:var(--muted);font-size:10px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-pagination{display:flex;justify-content:space-between;margin-top:6px}button{font:inherit;font-size:11px;color:var(--muted);background:none;border:0;padding:6px 0;cursor:pointer}button:hover{color:var(--blue)}button:disabled{visibility:hidden}
footer{margin-top:32px;color:var(--muted);font-size:11px}summary{cursor:pointer;width:fit-content}#sources{columns:3;column-gap:24px;margin-top:12px}#sources li{break-inside:avoid;margin-bottom:8px}[hidden]{display:none!important}
@media(max-width:1099px){#items{grid-template-columns:repeat(2,minmax(0,1fr))}#sources{columns:2}}
@media(max-width:539px){#items{grid-template-columns:1fr}main{padding:24px 16px 40px}.intro{gap:14px}input{width:100%}#sources{columns:1}}
main{max-width:1500px;padding:24px 20px 36px}header{margin-bottom:18px}header>a{font-size:15px}.intro{margin-bottom:10px;justify-content:flex-start;gap:12px}h1{font-size:21px}#daily-count{color:var(--muted);font-size:10px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.date-controls{display:flex;align-items:center;gap:6px}.toolbar input{padding:6px 8px;font-size:12px}.toolbar input[type=date]{width:145px}.toolbar input[type=search]{width:180px}.toolbar button{padding:6px 8px;font-size:12px}.toolbar button:disabled{visibility:visible;opacity:.3;cursor:default}
#items{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.topic-section{padding:12px;border-radius:5px}h2{font-size:12px;margin-bottom:8px}.topic-section li{padding:7px 0;line-height:1.4}.topic-section li>a{font-size:11px;font-weight:400}footer{margin-top:20px}#status{font-size:10px}
@media(max-width:1199px){#items{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:899px){#items{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:539px){main{padding:18px 14px 28px}#items{grid-template-columns:1fr}.toolbar{flex-wrap:wrap;gap:8px}.toolbar input[type=search]{width:100%;font-size:16px}.toolbar input[type=date]{width:160px;font-size:16px}.toolbar button{min-width:40px;min-height:44px}.topic-section li{padding:10px 0}.topic-section li>a{font-size:13px;line-height:1.5}h2{font-size:14px}.date-controls{width:100%;justify-content:space-between}header{margin-bottom:18px}}
.toolbar{flex-wrap:wrap}.toolbar input[type=search]{margin-left:auto}#starred{white-space:nowrap;border:1px solid var(--line);border-radius:5px;padding:6px 10px}#starred[aria-pressed=true]{color:var(--blue);border-color:var(--blue)}.topic-section li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px;align-items:start}.star{font-size:19px;line-height:1;padding:0;min-height:26px;width:24px;color:var(--muted)}.star[aria-pressed=true]{color:var(--blue)}.star-help{color:var(--muted);font-size:11px;margin:0 0 14px}
@media(max-width:539px){.topic-section li{grid-template-columns:40px minmax(0,1fr);gap:4px;padding:5px 0}.star{width:40px;min-height:44px;font-size:22px}.topic-section li>a{padding:10px 0}.toolbar input[type=search]{width:auto;flex:1;min-width:100px}#starred{min-height:44px}}
#following{border:1px solid var(--line);border-radius:5px;padding:6px 10px;white-space:nowrap}
#following-dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;width:min(1100px,calc(100vw - 32px));max-height:85dvh;padding:24px}#following-dialog::backdrop{background:rgba(0,0,0,.4)}.following-header{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:16px}#following-title{font-size:20px;margin:0}#following-count{color:var(--muted);font-size:11px;margin:4px 0}#following-close{min-height:40px;padding:8px}#following-search{width:100%;margin-bottom:22px}#following-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.following-group{min-width:0}.following-group h3{font-size:12px;color:var(--blue);margin:0 0 10px}.following-group li{padding:9px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.following-group a{font-size:12px}.following-status{display:block;font-size:10px;color:var(--muted);margin-top:3px}
@media(max-width:899px){#following-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:539px){#following-dialog{padding:18px;max-height:90dvh}#following-grid{grid-template-columns:1fr}#following-search{font-size:16px}#following{min-height:44px}.following-group a{font-size:13px}}
</style>
</head>
<body><main>
<header><a href="/">Clayton Petty</a><nav><a href="/">Home</a></nav></header>
<div class="intro"><h1>Reading</h1><span id="daily-count" role="status"></span></div>
<div class="toolbar"><div class="date-controls" id="date-controls"><button id="previous-day" type="button" aria-label="Previous day">←</button><input id="day" type="date" aria-label="Reading date"><button id="next-day" type="button" aria-label="Next day">→</button><button id="today" type="button">Today</button></div><button id="starred" type="button" aria-pressed="false">☆ Starred</button><button id="following" type="button" aria-haspopup="dialog" disabled>Following</button><input id="search" type="search" aria-label="Search articles" placeholder="Search"></div>
<p id="star-help" class="star-help" hidden>Stars from all dates, saved in this browser.</p><p id="star-notice" class="star-help" role="status" hidden></p><p id="empty" role="status" hidden>No matching articles.</p><div id="items"></div>
<footer><p id="status" role="status">Loading…</p><details><summary>Update details</summary><p id="source-status"></p></details></footer>
<dialog id="following-dialog" aria-labelledby="following-title">
<div class="following-header"><div><h2 id="following-title">Following</h2><p id="following-count" role="status"></p></div><button id="following-close" type="button" aria-label="Close Following">Close ×</button></div>
<input id="following-search" type="search" aria-label="Search followed sources" placeholder="Find a person, blog, or newsletter" autofocus>
<p id="following-empty" role="status" hidden>No matching sources.</p><div id="following-grid"></div>
</dialog>
<noscript>Please enable JavaScript to display articles.</noscript>
</main><script src="reading.js?v=following-1" defer></script></body></html>
