name: Refresh reading list and publish site
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: website-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/update_reading.py
      - name: Save collection baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily reading list"
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site/reading
          cp index.html Headshot2.jpg CNAME _site/
          cp reading/index.html reading/reading.js reading/data.json _site/reading/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
